[package]
name = "vibebar-p4"
version = "0.1.0"
edition = "2024"
license = "WTFPL"

[dependencies]
gtk4 = "0.11"
gdk4 = "0.11"
glib = "0.22"
gtk4-layer-shell = "0.8"
chrono = "0.4"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
niri-ipc = "26.4"
swayipc-async = "3.0.0"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
zbus = "5"
system-tray = "0.8"
pulse = { package = "libpulse-binding", version = "2.30" }
reqwest = { version = "0.13", features = ["json", "blocking"] }
async-trait = "0.1"
futures-util = "0.3"
nix = { version = "0.31", features = ["fs", "process", "inotify", "signal"] }
cairo-rs = "0.22"
mpris = "2.1"
x11rb = { version = "0.14", features = ["all-extensions"] }
